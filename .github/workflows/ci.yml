name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catch runner image and trust store changes

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest   # the Ubuntu runner image no longer offers 3.9
            python: "3.9"
        include:
          - os: ubuntu-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests (olefile is installed only to cross-check the OLE test files)
        run: |
          python -m pip install --quiet olefile
          python -m unittest discover -s tests -v
      - name: Indicators are embedded in both scanners
        run: python tools/embed_indicators.py --check
      - name: Self-test
        run: python emudhra_scan.py --self-test

      - name: Sample files are flagged exactly as expected
        shell: bash
        run: |
          python tests/make_samples.py samples
          set +e
          python emudhra_scan.py --no-trust-stores --no-processes --quiet --path samples --json py-samples.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python tests/compare_reports.py samples/expected.json py-samples.json

      - name: Quick scan reads this runner's real trust stores
        shell: bash
        run: |
          set +e
          python emudhra_scan.py --quick --no-processes --json quick.json
          rc=$?
          set -e
          echo "exit code $rc"
          test "$rc" -le 2
          python tests/check_report.py quick.json --min-certs 50 --min-sources 1

      - name: Install NSS tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libnss3-tools
      - name: Certificates planted in real OS stores are found
        shell: bash
        env:
          E2E_ALLOW_STORE_CHANGES: "1"
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Linux" ]; then extra="--require-nss --require-java"; fi
          python tests/e2e_os_stores.py --scanner python $extra

      - name: Signer certificates are extracted from real signed files
        shell: bash
        run: |
          extra=""
          if [ "$RUNNER_OS" = "Windows" ]; then extra="--require-msi"; fi
          python tests/real_signed_files.py --scanner python $extra

      - name: Default scan of this runner (time-limited)
        if: matrix.python == '3.13'
        shell: bash
        run: |
          set +e
          python emudhra_scan.py --time-limit 900 --no-processes --json "default-${{ runner.os }}.json"
          rc=$?
          set -e
          echo "exit code $rc"
          test "$rc" -le 2
          python tests/check_report.py "default-${{ runner.os }}.json" --min-certs 50 --min-sources 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ runner.os }}-py${{ matrix.python }}
          path: "*.json"
          if-no-files-found: ignore

  powershell:
    name: ${{ matrix.shell }} on Windows
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]   # Windows PowerShell 5.1 and PowerShell 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5   # runs the test drivers; the scanner under test is PowerShell
        with:
          python-version: "3.13"

      - name: Self-test
        shell: bash
        run: ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./Scan-EmudhraRevoked.ps1 -SelfTest

      - name: Sample files are flagged exactly as expected
        shell: bash
        run: |
          python tests/make_samples.py samples
          set +e
          ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./Scan-EmudhraRevoked.ps1 -NoTrustStores -NoProcesses -Quiet -Path samples -JsonOut ps-samples.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python tests/compare_reports.py samples/expected.json ps-samples.json

      - name: Quick scan reads this runner's real certificate stores
        shell: bash
        run: |
          set +e
          ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./Scan-EmudhraRevoked.ps1 -Quick -NoProcesses -JsonOut quick.json
          rc=$?
          set -e
          echo "exit code $rc"
          test "$rc" -le 2
          python tests/check_report.py quick.json --min-certs 50 --min-sources 1

      - name: Certificates planted in real Windows stores are found
        shell: bash
        env:
          E2E_ALLOW_STORE_CHANGES: "1"
        run: python tests/e2e_os_stores.py --scanner ${{ matrix.shell }}

      - name: Signer certificates are extracted from real signed files
        shell: bash
        run: python tests/real_signed_files.py --scanner ${{ matrix.shell }} --require-msi

      - name: Default scan of this runner (time-limited)
        shell: bash
        run: |
          set +e
          ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File ./Scan-EmudhraRevoked.ps1 -TimeLimitSec 900 -NoProcesses -JsonOut "default-${{ matrix.shell }}.json"
          rc=$?
          set -e
          echo "exit code $rc"
          test "$rc" -le 2
          python tests/check_report.py "default-${{ matrix.shell }}.json" --min-certs 50 --min-sources 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-windows-${{ matrix.shell }}
          path: "*.json"
          if-no-files-found: ignore
